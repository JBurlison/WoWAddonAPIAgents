name: Release plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-plugin
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish versioned archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
